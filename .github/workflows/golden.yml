name: 골든셋 회귀 (FR-18)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  golden:
    name: 골든셋 V1~V6 검증
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 골든셋 회귀 테스트
        run: npx vitest run tests/golden/run_golden.test.ts --reporter=verbose

      - name: 테스트 결과 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-results
          path: |
            eval/golden_*.json
          retention-days: 7
