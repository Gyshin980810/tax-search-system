name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint · TypeCheck · Test
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 린트 검사
        run: npm run lint

      - name: 타입 검사
        run: npm run typecheck

      - name: 단위 · 통합 테스트
        run: npm run test
        env:
          NATIONAL_TAX_API_KEY: ${{ secrets.NATIONAL_TAX_API_KEY }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: E2E 테스트 (골든 시나리오 5건)
        run: npm run test:e2e
        env:
          NATIONAL_TAX_API_KEY: e2e-dummy
          OPENAI_API_KEY: e2e-dummy

      - name: Playwright 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
